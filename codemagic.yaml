# Codemagic CI/CD for the Capacitor shell + native widgets.
# Cloud build (no local Mac needed). Assumes the ios/ and android/ Capacitor
# projects are COMMITTED (generated once via `npx cap add`, with the widget targets
# added — see WIDGETS.md). Builds run `cap sync`, not `cap add`, so native edits
# (widget extension, manifest, plugin registration) are preserved.
#
# Set these in Codemagic → each app's Environment variables (mark secrets "Secure"):
#   Android group "shareday_android": CM_KEYSTORE (base64 .jks), CM_KEYSTORE_PASSWORD,
#     CM_KEY_ALIAS, CM_KEY_PASSWORD, GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play JSON).
#   iOS group "shareday_ios": APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#     APP_STORE_CONNECT_PRIVATE_KEY, plus a matching Distribution + Widget provisioning profile.
# NEVER commit these values.

workflows:
  # ── Fastest path: no signing, no Play. Builds a debug APK you download from the
  #    build's Artifacts and sideload to your phone. Also compile-verifies the widget
  #    integration (a green build = the native code compiles). Start here.
  android-debug:
    name: ShareDay Android — debug APK (sideload)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install JS deps
        script: npm ci
      - name: Build the offline app shell (capacitor-www/)
        script: npm run build:shell
      - name: Capacitor sync (android/ is committed)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  android-internal:
    name: ShareDay Android — Play internal
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - shareday_android
      node: 20
      java: 17
    scripts:
      - name: Install JS deps
        script: npm ci
      - name: Build the offline app shell (capacitor-www/)
        script: npm run build:shell
      - name: Capacitor sync (platforms are committed)
        script: npx cap sync android
      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/release.keystore"
          cat >> "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=release.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-testflight:
    name: ShareDay iOS — TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: shareday_asc_key   # configure the ASC API key integration in Codemagic
    environment:
      groups:
        - shareday_ios
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        APP_BUNDLE_ID: com.mygenie.shareday
        WIDGET_BUNDLE_ID: com.mygenie.shareday.ShareDayWidget
    scripts:
      - name: Install JS deps
        script: npm ci
      - name: Build the offline app shell (capacitor-www/)
        # SHAREDAY_BUILD_ID is stamped into the shell and shown at the bottom of the
        # app menu, so a test device can prove which commit it is running.
        script: SHAREDAY_BUILD_ID="$(git rev-parse --short HEAD)" npm run build:shell
      - name: Capacitor sync (platforms are committed)
        script: npx cap sync ios
      # The widget target lives in the committed project.pbxproj. This is a safety net:
      # idempotent, so it re-adds the target only if a cap regeneration ever drops it.
      - name: Ensure the widget target exists
        script: |
          gem install xcodeproj --no-document
          ruby scripts/ios-add-widget-target.rb
      - name: Pods
        script: cd ios/App && pod install
      # The app and its extension are two bundle IDs and need a profile each — the
      # automatic ios_signing block only handles one, so fetch both explicitly.
      # Both App IDs must already exist with the App Groups capability (see WIDGETS.md).
      - name: Fetch signing files (app + widget extension)
        script: |
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      # TestFlight rejects a build number it has already seen. $BUILD_NUMBER is
      # Codemagic's own counter; -all applies it to the app AND the widget, whose
      # CFBundleVersion has to match the app's.
      - name: Set the build number
        script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

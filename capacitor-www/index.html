<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>셰어데이</title>
    <style>
      html,body{height:100%;margin:0;background:#EFFBF3;color:#0F241A;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
      @media (prefers-color-scheme: dark){html,body{background:#000;color:#F2F2F4}}
      .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
      .mark{width:44px;height:44px;position:relative}
      .mark::before{content:"";position:absolute;left:2px;top:3px;width:27px;height:27px;border-radius:9px;background:#34D399}
      .mark::after{content:"";position:absolute;right:2px;bottom:3px;width:27px;height:27px;border-radius:9px;background:#0EA271}
      h1{font-size:20px;font-weight:800;margin:0}
      p{font-size:14px;color:#557463;margin:0;max-width:280px;line-height:1.5}
      @media (prefers-color-scheme: dark){p{color:#9A9AA0}}
      a{margin-top:8px;color:#10B981;font-weight:700;text-decoration:none;font-size:15px}
    </style>
  </head>
  <body>
    <!-- Fallback only: Capacitor normally loads server.url (the deployed web app).
         This shows if the device is offline or the remote URL is unreachable. -->
    <div class="box">
      <div class="mark"></div>
      <h1>셰어데이</h1>
      <p>연결이 필요해요. 인터넷을 확인한 뒤 다시 열어 주세요.</p>
      <a href="https://shareday-seven.vercel.app">다시 시도</a>
    </div>
  </body>
</html>
